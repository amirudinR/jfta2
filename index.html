<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>暗記帳 — Hiragana, Katakana, Kotoba, Kanji &amp; Bunpo JFT A2</title>
    <meta name="description" content="Aplikasi hafalan bahasa Jepang JFT-Basic A2 dengan ulangan berjarak (spaced repetition)." />
    <meta name="theme-color" content="#0c1f2f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Anti-flash: terapkan dark mode sebelum React render.
      try {
        var _s = JSON.parse(localStorage.getItem('hafalan-jft-a2-progress-v2') || '{}')
        if (_s.prefs && _s.prefs.darkMode) document.documentElement.classList.add('dark-mode')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
